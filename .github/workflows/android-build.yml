name: Build Android APK

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Web Directory
        run: |
          mkdir dist
          cp -r css js index.html manifest.json sw.js dist/
          cp -r assets dist/ 2>/dev/null || true
          cp -r images dist/ 2>/dev/null || true
          cp -r models dist/ 2>/dev/null || true
          cp -r textures dist/ 2>/dev/null || true

      - name: Install dependencies and Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npx cap init "WaveLab" "com.wavelab.app" --web-dir dist
          npx cap add android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android App
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaveLab-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
